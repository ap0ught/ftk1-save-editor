<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>FTK1 Player DB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>body{padding:16px;} .code{font-family:monospace;font-size:12px;}</style>
</head>
<body class="container-fluid">
<nav class="navbar navbar-light bg-light mb-3"><span class="navbar-brand">FTK1 Player DB Editor — {{filename}}</span></nav>
<input type="hidden" id="SID" value="{{sid}}">
<div class="mb-3">
  <button class="btn btn-success" onclick="exportDb()">Download player.db</button>
  <button class="btn btn-warning" onclick="saveDbPath()">Save to source path</button>
  <button class="btn btn-primary" onclick="unlockAllLore()">Unlock all lore</button>
  <span id="status" class="ms-3"></span>
</div>
<div class="row">
  <div class="col-md-6">
    <h5>Statistics</h5>
    <div class="input-group mb-2">
      <input class="form-control" id="statFilter" placeholder="filter" oninput="renderStats()">
    </div>
    <div style="max-height:600px;overflow:auto;">
      <table class="table table-sm">
        <thead><tr><th>Name</th><th>Value</th><th></th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </div>
  <div class="col-md-6">
    <h5>Achievements</h5>
    <div class="input-group mb-2">
      <input class="form-control" id="achFilter" placeholder="filter" oninput="renderAchs()">
    </div>
    <div style="max-height:600px;overflow:auto;">
      <table class="table table-sm">
        <thead><tr><th>Name</th><th>Achieved</th><th></th></tr></thead>
        <tbody id="achsBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SID=document.getElementById('SID').value;
function setStatus(m){document.getElementById('status').textContent=m;}
async function api(path,method='GET',body=null){const opts={method,headers:{}};if(body!==null){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}const r=await fetch(path,opts);const t=await r.text();let j;try{j=JSON.parse(t);}catch(e){j={raw:t};}if(!r.ok) throw new Error(j.error||t);return j;}
let stats=[],achs=[];
async function load(){const d=await api(`/api/db/${SID}/stats`);stats=d.stats;achs=d.achievements;renderStats();renderAchs();}
function renderStats(){const f=document.getElementById('statFilter').value.toLowerCase();const tb=document.getElementById('statsBody');tb.innerHTML='';stats.filter(s=>!f||s.name.toLowerCase().includes(f)).forEach(s=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="code">${s.name}</td><td><input class="form-control form-control-sm" style="width:90px" value="${s.value}" data-name="${s.name}"></td><td><button class="btn btn-sm btn-primary" onclick="setStat('${s.name}', this)">Save</button></td>`;tb.appendChild(tr);});}
function renderAchs(){const f=document.getElementById('achFilter').value.toLowerCase();const tb=document.getElementById('achsBody');tb.innerHTML='';achs.filter(a=>!f||a.name.toLowerCase().includes(f)).forEach(a=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="code">${a.name}</td><td><input type="checkbox" ${a.achieved?'checked':''} data-name="${a.name}"></td><td><button class="btn btn-sm btn-primary" onclick="setAch('${a.name}', this)">Save</button></td>`;tb.appendChild(tr);});}
async function setStat(name, btn){const input=btn.parentNode.parentNode.querySelector('input');try{await api(`/api/db/${SID}/set_stat`,'POST',{name:name,value:parseInt(input.value,10)});setStatus('Saved '+name);}catch(e){setStatus('Error: '+e.message);}}
async function setAch(name, btn){const cb=btn.parentNode.parentNode.querySelector('input[type="checkbox"]');try{await api(`/api/db/${SID}/set_achievement`,'POST',{name:name,achieved:cb.checked});setStatus('Saved '+name);}catch(e){setStatus('Error: '+e.message);}}
async function unlockAllLore(){try{const d=await api(`/api/db/${SID}/unlock_all_lore`,'POST',{});setStatus('Unlocked lore: '+d.unlocked);await load();}catch(e){setStatus('Error: '+e.message);}}
function exportDb(){window.location=`/api/db/${SID}/export`;}
async function saveDbPath(){const path=prompt('Path to write player.db (blank for original):','');const body=path?{path:path}:{};try{const d=await api(`/api/db/${SID}/save_to_path`,'POST',body);setStatus('Saved to '+d.path);}catch(e){setStatus('Error: '+e.message);}}
load();
</script>
</body>
</html>
